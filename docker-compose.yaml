version: "3.9"  # optional but good practice

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    container_name: symfony-mysql
    environment:
      MYSQL_ROOT_PASSWORD: test_demo_root_password
      MYSQL_DATABASE: test_demo_db
      MYSQL_USER: test_demo_user
      MYSQL_PASSWORD: test_demo_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - test_demo_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: unless-stopped
    container_name: phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_USER: test_demo_user
      PMA_PASSWORD: test_demo_password
    ports:
      - "8080:80"
    depends_on:
      - mysql
    networks:
      - test_demo_network

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www/html
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - php
      - mysql
    networks:
      - test_demo_network

  php:
    image: php:8.2-fpm
    restart: unless-stopped
    container_name: php-fpm
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: mysql
      DB_USER: test_demo_user
      DB_PASSWORD: test_demo_password
      DB_NAME: test_demo_db
    depends_on:
      - mysql
    networks:
      - test_demo_network

volumes:
  mysql_data:

networks:
  test_demo_network:

